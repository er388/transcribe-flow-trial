profile=low-latency
keep-open=yes

# Show a window (and OSC) even for audio-only files
force-window=yes                    # keep a GUI for audio; useful for dictation.
idle=yes                            # keep the window open when a file ends (handy when opening many files)
ontop                               # keep it floating above other apps
keepaspect-window=no                # allow arbitrary short height
border=yes                          # no window frame
title-bar=yes                       # show title bar (Windows)
audio-display=no                    # don't show album art as "video"
auto-window-resize=no              # don't resize when new files open
geometry=800x100                    # width x height in px

# On-screen controller (OSC) – solid bottom bar, always visible
osc=yes

# Tight, accurate seeking (great for 1–2s back/forward)
hr-seek=yes
hr-seek-framedrop=no

# Quality-of-life for transcribers
save-position-on-quit=yes
osd-on-seek=bar

# Keep pitch natural while changing speed (mpv does this by default)
audio-pitch-correction=yes

# Optional hardening for a locked-down deployment
load-scripts=no
ytdl=no

# --- Make mpv learn total duration automatically ---
# Enable the demuxer cache (also used for local files when forced)
cache=yes

# Let it cache to a temp file so large/long audio doesn't eat RAM
cache-on-disk=no

# Allow caching a lot of packets so it can reach EOF quickly
demuxer-max-bytes=64MiB
demuxer-max-back-bytes=32MiB
demuxer-lavf-analyzeduration=60
demuxer-lavf-probesize=50
demuxer=lavf

# (A) Lock total time from second 1 (pre-read to EOF before playback starts)
demuxer-cache-wait=yes
# (B) Start instantly; total time will lock as the file is cached in background
# demuxer-cache-wait=no

input-ipc-server=\\.\pipe\mpv-transcribe
pause=yes
